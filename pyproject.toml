[project]
name = "fff-backend"
version = "0.1.0"
description = "Future Farms Framework (FFF) Digital Platform — backend"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Victor", email = "victor@fff.local" },
    { name = "Santana", email = "santana@fff.local" },
    { name = "Liz Wahome", email = "liz@fff.local" },
    { name = "Nikki Mackenzie", email = "nikki@fff.local" },
]

dependencies = [
    # ─── Web framework ────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",

    # ─── Database ────────────────────────────────────────────────────
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",

    # ─── Data + validation ───────────────────────────────────────────
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pydantic[email]>=2.10.0",

    # ─── Async / http ─────────────────────────────────────────────────
    "httpx>=0.28.0",
    "anyio>=4.6.0",

    # ─── Task queue ───────────────────────────────────────────────────
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",

    # ─── LLM ──────────────────────────────────────────────────────────
    "anthropic>=0.39.0",

    # ─── ML & MLOps ──────────────────────────────────────────────────
    "scikit-learn>=1.6.0",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "mlflow>=2.10.0",
    "great-expectations>=0.18.0",
    "gradio>=4.19.0",
    "optuna>=3.5.0",

    # ─── Reporting (PDF) ──────────────────────────────────────────────
    "reportlab>=4.2.0",

    # ─── Auth ─────────────────────────────────────────────────────────
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",

    # ─── Utilities ────────────────────────────────────────────────────
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "faker>=33.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─── Pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["src/backend/tests"]
addopts = "-ra -q --strict-markers"
pythonpath = ["src/backend"]
asyncio_mode = "auto"

# ─── Ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # function-call-in-default-argument (FastAPI uses this idiom)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# ─── MyPy ───────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
